name: energy-analysis
doc: 能效分析与节能诊断
keywords: [energy, 能耗, 能效, kpi, eui, carbon, 碳排放]
suggested_group: energy
include:
  - query-basics
prompt: |
  ## 能效分析工作流

  1. **获取数据** — 用 `evalAxon("readAll(elecMeter)")` 获取所有电表
  2. **读取历史** — 读取关键表计的历史数据（日/月粒度）
  3. **计算指标**:
     - EUI (能耗强度) = 总能耗 ÷ 建筑面积
     - COP (性能系数) = 制冷量 ÷ 耗电量
     - 峰谷比 = 峰值能耗 ÷ 谷值能耗
  4. **对比基线** — 与历史同期或设计值对比
  5. **发现异常** — 非工作时段能耗过高、设备效率明显下降
  6. **给出建议** — 基于分析结果给出节能建议

  ### 常见分析维度
  - 分项能耗（照明、空调、动力、特殊）
  - 分时段能耗（工作日 vs 非工作日、峰谷平）
  - 设备效率（冷机 COP、水泵效率、风机效率）
  - 碳排放核算（用电量 × 排放因子）
