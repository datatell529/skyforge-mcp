name: work-order
doc: 工单全生命周期管理
keywords: [work order, 工单, wo, 维修, 保养]
suggested_group: base
include:
  - query-basics
prompt: |
  ## 工单管理工作流

  1. **列出工单** — `finMcpListWorkOrders(status)` 按状态筛选
  2. **创建工单** — `finMcpCreateWorkOrder(description, priority)`
  3. **关闭工单** — `finMcpCloseWorkOrder(workOrderId, resolution)`

  ### 优先级说明
  - high: 紧急故障，需立即处理
  - medium: 一般问题，计划内处理
  - low: 改进建议，可延后处理
